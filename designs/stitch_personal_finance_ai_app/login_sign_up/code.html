<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { 'colors': { 'on-primary': '#ffffff', 'outline-variant': '#c5c6cd', 'tertiary-fixed-dim': '#ffb4ab', 'on-tertiary-fixed': '#410002', 'surface-container-highest': '#e0e3e5', 'secondary': '#006e2d', 'on-primary-container': '#79849b', 'surface-dim': '#d8dadc', 'on-tertiary': '#ffffff', 'tertiary-container': '#410002', 'on-error': '#ffffff', 'on-secondary': '#ffffff', 'error-container': '#ffdad6', 'tertiary-fixed': '#ffdad6', 'secondary-fixed': '#7ffc97', 'surface-container-low': '#f2f4f6', 'primary-fixed': '#d7e3fc', 'surface': '#f7f9fb', 'surface-tint': '#535f74', 'error': '#ba1a1a', 'on-surface': '#191c1e', 'on-secondary-fixed-variant': '#005320', 'inverse-primary': '#bbc7df', 'surface-container-lowest': '#ffffff', 'surface-container': '#eceef0', 'primary-fixed-dim': '#bbc7df', 'on-secondary-fixed': '#002109', 'on-tertiary-fixed-variant': '#93000b', 'on-primary-fixed-variant': '#3c475b', 'surface-bright': '#f7f9fb', 'on-error-container': '#93000a', 'surface-container-high': '#e6e8ea', 'secondary-fixed-dim': '#62df7d', 'inverse-on-surface': '#eff1f3', 'primary-container': '#101c2e', 'secondary-container': '#7cf994', 'tertiary': '#000000', 'background': '#f7f9fb', 'on-background': '#191c1e', 'on-primary-fixed': '#101c2e', 'primary': '#000000', 'outline': '#75777d', 'inverse-surface': '#2d3133', 'on-tertiary-container': '#f63a35', 'on-secondary-container': '#007230', 'surface-variant': '#e0e3e5', 'on-surface-variant': '#45474c' }, 'borderRadius': { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, 'spacing': { 'space-xl': '2rem', 'space-md': '1rem', 'gutter-sm': '0.75rem', 'space-sm': '0.5rem', 'margin-desktop': '2rem', 'space-lg': '1.5rem', 'margin': '1rem', 'gutter': '1rem', 'space-xs': '0.25rem', 'margin-tablet': '1.5rem' }, 'fontFamily': { 'body-lg': ['Inter'], 'metric-xl': ['Inter'], 'display-lg': ['Inter'], 'body-sm': ['Inter'], 'headline-lg': ['Inter'], 'metric-lg': ['Inter'], 'label-md': ['Inter'], 'body-md': ['Inter'], 'headline-md': ['Inter'], 'title-md': ['Inter'], 'title-lg': ['Inter'], 'headline-sm': ['Inter'], 'metric-md': ['Inter'], 'label-sm': ['Inter'], 'label-lg': ['Inter'] }, 'fontSize': { 'body-lg': ['16px', { 'lineHeight': '24px', 'fontWeight': '400' }], 'metric-xl': ['32px', { 'lineHeight': '38px', 'letterSpacing': '-0.02em', 'fontWeight': '700' }], 'display-lg': ['36px', { 'lineHeight': '44px', 'letterSpacing': '-0.02em', 'fontWeight': '700' }], 'body-sm': ['13px', { 'lineHeight': '18px', 'fontWeight': '400' }], 'headline-lg': ['30px', { 'lineHeight': '38px', 'letterSpacing': '-0.02em', 'fontWeight': '700' }], 'metric-lg': ['24px', { 'lineHeight': '30px', 'letterSpacing': '-0.01em', 'fontWeight': '700' }], 'label-md': ['12px', { 'lineHeight': '16px', 'letterSpacing': '0.02em', 'fontWeight': '500' }], 'body-md': ['14px', { 'lineHeight': '20px', 'fontWeight': '400' }], 'headline-md': ['24px', { 'lineHeight': '32px', 'letterSpacing': '-0.015em', 'fontWeight': '600' }], 'title-md': ['16px', { 'lineHeight': '24px', 'fontWeight': '600' }], 'title-lg': ['18px', { 'lineHeight': '26px', 'letterSpacing': '-0.005em', 'fontWeight': '600' }], 'headline-sm': ['20px', { 'lineHeight': '28px', 'letterSpacing': '-0.01em', 'fontWeight': '600' }], 'metric-md': ['18px', { 'lineHeight': '24px', 'fontWeight': '600' }], 'label-sm': ['11px', { 'lineHeight': '14px', 'letterSpacing': '0.04em', 'fontWeight': '600' }], 'label-lg': ['14px', { 'lineHeight': '20px', 'fontWeight': '500' }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full">
<!-- Brand Authority Header -->
<div class="bg-primary-container text-on-primary px-space-md pt-space-lg pb-space-xl flex flex-col items-center justify-center text-center relative overflow-hidden shadow-md">
<div class="absolute -right-12 -top-12 w-48 h-48 rounded-full bg-secondary/10 pointer-events-none blur-2xl"></div>
<div class="absolute -left-12 -bottom-12 w-48 h-48 rounded-full bg-on-primary-container/10 pointer-events-none blur-2xl"></div>
<!-- Stylized Brand Emblem -->
<div class="w-16 h-16 rounded-xl bg-surface-container-lowest p-2 shadow-sm flex items-center justify-center mb-space-sm relative z-10">
<img alt="Personal Finance AI Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9wXyqGHnejAX2ScD1CQsVtJy_1miaqaxV2rIh9WKgXmRAUXyoxBy2IL74TXL60wtXIbvbfaFSeFbNny0pVWGRDx4BL3LMXoZkolh2Rcqolq73f9U5GR2H3-n19Cc0rXGhxgIdvAKUmLT7cIs5uDNGV4C9BZROXUIptlvQKrJAumYbS4zX8p7yPv5hNMVhV8Vwa9bnjaHMLy7bQ9Lt2xzgRJ3_JJNtGTr8oeDi7IJwEIwoUdUpclOV6g"/>
</div>
<!-- Typography Branding -->
<h1 class="font-headline-md text-headline-md tracking-tight text-on-primary mb-space-xs">
      Personal Finance AI
    </h1>
<p class="font-label-md text-label-md text-on-primary-container tracking-wider uppercase font-medium">
      Smart Money Management for India
    </p>
<!-- Micro Metric Pulse -->
<div class="inline-flex items-center gap-1.5 mt-space-sm px-2.5 py-1 rounded-full bg-surface-container-lowest/10 backdrop-blur-sm">
<span class="w-2 h-2 rounded-full bg-secondary-fixed animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-primary">₹3,400+ Cr Intelligent Portfolios Monitored</span>
</div>
</div>
<!-- Main Interaction Card Container -->
<div class="px-space-md -mt-4 relative z-20 pb-space-lg">
<div class="bg-surface-container-lowest rounded-xl shadow-md p-space-md flex flex-col">
<!-- Interactive Tab Switch Toggle -->
<div class="bg-surface-container-low p-1 rounded-lg flex items-center mb-space-md">
<button class="flex-1 py-2 text-center rounded font-title-md text-title-md transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm" id="tab-signin" onclick="switchAuthTab('signin')" type="button">
          Sign In
        </button>
<button class="flex-1 py-2 text-center rounded font-title-md text-title-md transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="tab-signup" onclick="switchAuthTab('signup')" type="button">
          Create Account
        </button>
</div>
<!-- Auth Form Container -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- Dynamic Name Field (Visible on Register) -->
<div class="hidden flex-col gap-space-xs" id="field-name-container">
<label class="font-label-md text-label-md text-on-surface-variant">Full Legal Name</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all">
<span class="material-symbols-outlined text-outline-variant absolute left-3 select-none">badge</span>
<input class="w-full bg-transparent py-3 pl-10 pr-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="input-name" placeholder="As per PAN card" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Email Address</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all">
<span class="material-symbols-outlined text-outline-variant absolute left-3 select-none">alternate_email</span>
<input class="w-full bg-transparent py-3 pl-10 pr-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="input-email" placeholder="name@domain.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">Password</label>
<a class="font-label-sm text-label-sm text-primary-container font-semibold hover:underline" href="javascript:void(0)" id="forgot-password-link">
              Forgot Password?
            </a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all">
<span class="material-symbols-outlined text-outline-variant absolute left-3 select-none">lock</span>
<input class="w-full bg-transparent py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" id="input-password" placeholder="••••••••••••" type="password"/>
<button class="absolute right-3 text-outline-variant hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined select-none text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Phone Field (Register Specific) -->
<div class="hidden flex-col gap-space-xs" id="field-phone-container">
<label class="font-label-md text-label-md text-on-surface-variant">Mobile Number (for instant OTP verification)</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all">
<div class="absolute left-3 flex items-center gap-1 select-none">
<span class="font-label-md text-label-md text-on-surface font-semibold">+91</span>
<span class="text-outline-variant">|</span>
</div>
<input class="w-full bg-transparent py-3 pl-16 pr-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none tabular-nums" id="input-phone" maxlength="10" placeholder="98765 43210" type="tel"/>
</div>
</div>
<!-- Primary Emerald Conversion Action -->
<button class="w-full bg-secondary text-on-secondary py-3.5 px-space-md rounded-lg font-title-md text-title-md font-semibold tracking-wide shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-space-xs" id="submit-btn" type="submit">
<span id="submit-label">Sign In to Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Editorial Section Divider -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="w-full h-px bg-surface-container"></div>
<span class="bg-surface-container-lowest px-3 font-label-sm text-label-sm uppercase tracking-wider text-outline select-none absolute">
          Or continue with
        </span>
</div>
<!-- Federated Social Sign-in Array -->
<div class="grid grid-cols-3 gap-space-sm">
<!-- Google Sign-in -->
<button class="flex flex-col items-center justify-center gap-1 py-2.5 px-2 bg-surface-container-low hover:bg-surface-container transition-colors rounded-lg group" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span class="font-label-sm text-label-sm text-on-surface font-medium">Google</span>
</button>
<!-- Apple ID Sign-in -->
<button class="flex flex-col items-center justify-center gap-1 py-2.5 px-2 bg-surface-container-low hover:bg-surface-container transition-colors rounded-lg group" type="button">
<span class="material-symbols-outlined text-[22px] text-on-surface" style="font-variation-settings: 'FILL' 1;">
            phone_iphone
          </span>
<span class="font-label-sm text-label-sm text-on-surface font-medium">Apple ID</span>
</button>
<!-- Mobile OTP Sign-in -->
<button class="flex flex-col items-center justify-center gap-1 py-2.5 px-2 bg-surface-container-low hover:bg-surface-container transition-colors rounded-lg group" type="button">
<span class="material-symbols-outlined text-[22px] text-primary-container">
            sms
          </span>
<span class="font-label-sm text-label-sm text-on-surface font-medium">Mobile OTP</span>
</button>
</div>
<!-- Auth Footnote Switch -->
<div class="mt-space-md text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant" id="toggle-footer-prompt">
          New to Personal Finance AI? 
          <a class="text-primary-container font-semibold hover:underline ml-1" href="javascript:void(0)" onclick="switchAuthTab('signup')">
            Create an account
          </a>
</p>
</div>
</div>
<!-- Security & Regulatory Trust Badge -->
<div class="mt-space-md bg-surface-container-low rounded-lg p-space-sm flex items-center justify-center gap-2 text-center">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">
        verified_user
      </span>
<span class="font-label-sm text-label-sm text-on-surface-variant">
        256-bit Bank Grade Encryption • RBI Compliant Framework
      </span>
</div>
</div>
</div>
<script>
  let currentAuthMode = 'signin';

  function switchAuthTab(mode) {
    currentAuthMode = mode;
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const nameField = document.getElementById('field-name-container');
    const phoneField = document.getElementById('field-phone-container');
    const forgotLink = document.getElementById('forgot-password-link');
    const submitLabel = document.getElementById('submit-label');
    const footerPrompt = document.getElementById('toggle-footer-prompt');

    if (mode === 'signup') {
      // Toggle Tab Style
      tabSignIn.className = 'flex-1 py-2 text-center rounded font-title-md text-title-md transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      tabSignUp.className = 'flex-1 py-2 text-center rounded font-title-md text-title-md transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm';
      
      // Reveal Registration Fields
      nameField.classList.remove('hidden');
      nameField.classList.add('flex');
      phoneField.classList.remove('hidden');
      phoneField.classList.add('flex');
      forgotLink.classList.add('invisible');

      submitLabel.innerText = 'Create Free Account';
      footerPrompt.innerHTML = 'Already have an account? <a href="javascript:void(0)" onclick="switchAuthTab(\'signin\')" class="text-primary-container font-semibold hover:underline ml-1">Sign In</a>';
    } else {
      // Toggle Tab Style
      tabSignUp.className = 'flex-1 py-2 text-center rounded font-title-md text-title-md transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      tabSignIn.className = 'flex-1 py-2 text-center rounded font-title-md text-title-md transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm';
      
      // Hide Registration Fields
      nameField.classList.add('hidden');
      nameField.classList.remove('flex');
      phoneField.classList.add('hidden');
      phoneField.classList.remove('flex');
      forgotLink.classList.remove('invisible');

      submitLabel.innerText = 'Sign In to Account';
      footerPrompt.innerHTML = 'New to Personal Finance AI? <a href="javascript:void(0)" onclick="switchAuthTab(\'signup\')" class="text-primary-container font-semibold hover:underline ml-1">Create an account</a>';
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('input-password');
    const toggleIcon = document.getElementById('password-toggle-icon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.innerText = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      toggleIcon.innerText = 'visibility';
    }
  }
</script></main></body></html>
