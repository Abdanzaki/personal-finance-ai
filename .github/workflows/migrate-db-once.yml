name: One-time DB migration (Render to Neon)

# Manual one-off job: copies all data from the Render Postgres database
# into the Neon Postgres database. Run once via workflow_dispatch, then
# delete this file and the RENDER_DATABASE_URL / NEON_DATABASE_URL secrets.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Copy Render Postgres to Neon
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Dump from Render and restore into Neon
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -o pipefail
          export PATH=/usr/lib/postgresql/18/bin:$PATH
          pg_dump --version
          pg_dump --no-owner --no-acl "$RENDER_DATABASE_URL" | psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -q

      - name: Verify row counts on Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          export PATH=/usr/lib/postgresql/18/bin:$PATH
          psql "$NEON_DATABASE_URL" -c "
            SELECT 'users', count(*) FROM users
            UNION ALL SELECT 'accounts', count(*) FROM accounts
            UNION ALL SELECT 'transactions', count(*) FROM transactions
            UNION ALL SELECT 'budgets', count(*) FROM budgets
            UNION ALL SELECT 'savings_goals', count(*) FROM savings_goals
            UNION ALL SELECT 'goal_contributions', count(*) FROM goal_contributions
            UNION ALL SELECT 'ai_chat_messages', count(*) FROM ai_chat_messages;"
